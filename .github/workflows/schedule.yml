name: Daily News Fetcher & Notifier

on:
  schedule:
    # 毎日 日本時間の朝7時（UTC 22:00）に実行
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-news-tool:
    runs-on: ubuntu-latest
    steps:
      - name: 自分のプログラムをサーバーに持ってくる
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
        
      - name: Pythonを使えるようにする
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: 必要なライブラリをインストールする
        run: pip install -r requirements.txt
        
      - name: ニュース取得と通知の実行
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORK_EMAIL: ${{ secrets.WORK_EMAIL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python news_tool.py
