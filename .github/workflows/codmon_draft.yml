name: CoDMoN Auto Draft

on:
  workflow_dispatch:
    inputs:
      user_input:
        description: '連絡帳の入力内容（例: 熱36.8 ご飯全部 うんちなし）'
        required: true
        type: string

jobs:
  run-codmon-draft:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 依存ライブラリのインストール
        run: |
          cd codmon_automator
          pip install -r requirements.txt
          playwright install chromium

      - name: コドモンの一時保存を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODMON_ID: ${{ secrets.CODMON_ID }}
          CODMON_PASSWORD: ${{ secrets.CODMON_PASSWORD }}
          CODMON_INPUT: ${{ inputs.user_input }}
        run: |
          cd codmon_automator
          python codmon_draft.py

      - name: エラー時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: codmon_automator/error_screenshot.png
          retention-days: 3
